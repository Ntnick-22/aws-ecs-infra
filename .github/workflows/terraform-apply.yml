name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Layer to apply (all = bring the whole environment up in order)"
        type: choice
        default: all
        options:
          - all
          - ecr
          - github_oidc
          - 00_networking
          - 01_ecs
          - 02_data
          - 03_app
          - 04_observability

permissions:
  id-token: write
  contents: read

# One Terraform run at a time across apply and destroy
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::772297676546:role/myecs-github-infra
  TF_VERSION: 1.15.8
  # github_oidc is excluded from "all": it is the role this workflow runs as
  ENV_LAYERS: ecr 00_networking 01_ecs 02_data 03_app 04_observability
  # RDS classes to try in order when AWS has no capacity for the first one (both ~$0.02/h)
  DB_INSTANCE_CLASSES: db.t4g.micro db.t3.micro
  # Kept out of the repo (public): only 04_observability uses it
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  apply:
    name: Apply ${{ inputs.layer }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform apply
        run: |
          set -o pipefail
          if [ "${{ inputs.layer }}" = "all" ]; then LAYERS="$ENV_LAYERS"; else LAYERS="${{ inputs.layer }}"; fi
          for layer in $LAYERS; do
            echo "::group::$layer"
            terraform -chdir="$layer" init -input=false
            if [ "$layer" = "02_data" ]; then
              # Capacity fallback: try each class; move on ONLY for "no capacity" errors, fail fast on anything else
              applied=false
              for class in $DB_INSTANCE_CLASSES; do
                echo "Trying RDS instance class $class"
                if terraform -chdir="$layer" apply -auto-approve -input=false -no-color -var "instance_class=$class" 2>&1 | tee apply.log; then
                  applied=true
                  break
                fi
                grep -qiE 'InsufficientDBInstanceCapacity|sufficient capacity' apply.log || break
                echo "::warning::No RDS capacity for $class, trying the next class"
              done
              [ "$applied" = true ] || exit 1
            else
              terraform -chdir="$layer" apply -auto-approve -input=false -no-color
            fi
            echo "::endgroup::"
          done

      - name: Smoke test
        if: inputs.layer == 'all' || inputs.layer == '03_app'
        run: |
          # New tasks need a few minutes to pass ALB health checks
          for i in $(seq 1 30); do
            BODY=$(curl -s -m 5 https://myecs.nt-nick.link/api/health || true)
            echo "attempt $i: $BODY"
            echo "$BODY" | grep -q '"database":"connected"' && exit 0
            sleep 20
          done
          echo "::error::App did not become healthy within 10 minutes"
          exit 1
